<section id="screen-report-issue" class="hidden flex-1 flex flex-col px-4 pb-4 pt-4 bg-slate-50">
  <header class="relative flex items-center justify-center mb-4">
    <h1 class="text-base font-semibold">Contact Form</h1>
  </header>

  <div class="flex-1 flex flex-col items-center justify-start pt-2">
    <div class="w-full max-w-xl bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
      <p class="text-sm text-slate-700 mb-4">Thank you for reaching out. Our team will get back to you promptly.</p>

      <label class="block text-xs font-medium text-slate-600 mb-1">Your Name (Optional)</label>
      <input id="report-name" type="text" placeholder="Steve Leizer" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 mb-4 focus:outline-none" />

      <label class="block text-xs font-medium text-slate-600 mb-1">Your Feedback</label>
      <textarea id="report-feedback" rows="6" placeholder="How can we improve?" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 mb-6 focus:outline-none"></textarea>

      <div class="flex justify-center">
        <button onclick="submitFeedback()" class="w-full max-w-sm px-4 py-3 rounded-full bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Submit Feedback</button>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <button onclick="goBack()" class="w-full text-center py-3 rounded-full fa-btn">Back</button>
  </div>
</section>
