<section id="screen-login" class="hidden flex-col flex-1 px-6 py-10 bg-white">
  <div class="flex-1 flex flex-col justify-center items-center gap-8">
    <div class="flex flex-col items-center gap-3">
      <div class="w-16 h-16 rounded-2xl bg-indigo-100 flex items-center justify-center">
        <img src="assets/images/pixie_avatar_icon.png" alt="Pixie avatar" class="w-10 h-10 object-contain" />
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Pixie</h1>
      <p class="text-slate-500 text-center">Your AI Financial Guardian Angel</p>
    </div>

    <div class="w-full max-w-xs space-y-6">
      <div class="text-center">
        <h2 id="auth-title" class="text-xl font-semibold text-slate-800">Welcome!</h2>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="auth-username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="auth-username" required
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
            placeholder="Enter your username" />
        </div>
        
        <div id="email-group" class="hidden">
          <label for="auth-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="auth-email"
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
            placeholder="you@example.com" />
        </div>

        <div>
          <label for="auth-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="auth-password" required
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
            placeholder="••••••••" />
        </div>

        <div id="auth-error" class="hidden text-sm text-rose-600 text-center bg-rose-50 p-2 rounded-md"></div>

        <button type="submit" id="auth-submit-btn"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Log In
        </button>
      </form>

      <div class="text-center text-sm text-slate-600">
        <a href="#" id="toggle-auth-mode" class="hover:text-indigo-600 transition-colors">
          New to Pixie? <span class="text-indigo-600 font-semibold">Sign Up</span>
        </a>
      </div>
    </div>
  </div>
</section>
