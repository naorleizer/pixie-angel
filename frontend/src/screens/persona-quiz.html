<section id="screen-persona-quiz" class="hidden min-h-screen bg-slate-50">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <div class="mb-6 flex items-start justify-between">
      <div>
        <p class="text-sm uppercase tracking-wide text-indigo-500 font-semibold">Persona Match</p>
        <h1 class="text-3xl font-bold text-slate-900 mt-1">Find your Pixie coaching style</h1>
        <p class="text-slate-600 mt-2">Answer a few quick questions to tailor Pixie's tone. Takes under 2 minutes.</p>
      </div>
      <button id="persona-quiz-skip" class="text-slate-400 hover:text-slate-600 text-2xl font-light flex items-center justify-center w-8 h-8 hover:bg-slate-100 rounded transition" onclick="skipPersonaQuiz()" aria-label="Skip">✕</button>
    </div>

    <!-- Progress indicator -->
    <div class="mb-6 flex items-center justify-center gap-2" id="persona-quiz-progress-dots">
      <!-- Dots will be generated by persona-quiz.js -->
    </div>

    <div class="bg-white shadow-lg rounded-2xl p-8 border border-slate-100">
      <div id="persona-quiz-question-container">
        <!-- Single question rendered by persona-quiz.js -->
      </div>

      <div class="mt-8 flex items-center justify-between">
        <button id="persona-quiz-prev" class="px-4 py-2 text-slate-600 hover:text-slate-900 font-medium disabled:opacity-40 disabled:cursor-not-allowed" disabled>← Previous</button>
        <div id="persona-quiz-status" class="text-sm text-slate-500"></div>
        <button id="persona-quiz-next" class="px-5 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition disabled:opacity-60 disabled:cursor-not-allowed">Next →</button>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="persona-quiz-result-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8">
      <div class="text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-3xl font-bold mb-4">✓</div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Your Pixie Persona</h2>
        <h3 id="persona-result-title" class="text-xl font-semibold text-indigo-600 mb-3"></h3>
        <p id="persona-result-desc" class="text-slate-600 mb-4"></p>
        <p class="text-sm text-slate-500 mb-6">You can change your persona, interests, and motivations anytime in your profile settings.</p>
        <button id="persona-quiz-go-dashboard" class="w-full px-6 py-3 text-lg font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition">Continue to Dashboard</button>
      </div>
    </div>
  </div>
</section>
