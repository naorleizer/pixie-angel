<section id="screen-transactions" class="hidden flex-1 flex flex-col bg-slate-50">
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white sticky top-0 z-10">
      <div class="flex items-center gap-2">
        <button class="text-slate-700 font-semibold" onclick="goBack()" aria-label="Back">←</button>
        <span class="text-sm font-semibold">Transactions</span>
      </div>
      <div class="flex items-center gap-2">
        <button class="text-slate-500 hover:text-indigo-600" aria-label="Open help" onclick="openHelp()">
          <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">?</span>
        </button>
        <select id="category-filter" class="text-xs border border-slate-300 rounded px-2 py-1 bg-white">
          <option value="">All Categories</option>
        </select>
      </div>
    </header>
  
    <div class="flex-1 overflow-auto px-4 py-4">
      <div class="bg-white rounded-lg shadow-sm border border-slate-200">
        <table class="w-full text-sm" id="transactions-table">
          <tbody id="transactions-tbody">
            <!-- Transactions will be injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </section>
