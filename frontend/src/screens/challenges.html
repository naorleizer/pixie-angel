<section id="screen-challenges" class="hidden flex-1 flex flex-col bg-slate-50">
  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <button class="text-slate-700 font-semibold" onclick="goBack()" aria-label="Back">←</button>
      <span class="text-sm font-semibold">My Challenges</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="new-challenge-btn" class="text-xs font-medium px-3 py-1.5 rounded-full border border-slate-300 text-slate-600">
        + New
      </button>
      <button id="open-recycle-bin-btn" class="text-xs font-semibold border border-slate-300 rounded-full px-3 py-1.5 text-slate-600" aria-label="Open Recycle Bin">
        Recycle Bin
      </button>
      <button class="text-slate-500 hover:text-indigo-600" aria-label="Open help" onclick="openHelp()">
        <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">?</span>
      </button>
    </div>
  </header>

  <!-- Filter Tabs -->
  <div class="flex gap-2 px-4 pt-3 pb-2 bg-white border-b border-slate-200">
    <button id="filter-current" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-full border-indigo-600 bg-indigo-600 text-white" data-filter="current">
      Current
    </button>
    <button id="filter-past" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-full border border-slate-300 text-slate-600" data-filter="past">
      Past
    </button>
    <button id="filter-all" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-full border border-slate-300 text-slate-600" data-filter="all">
      All
    </button>
  </div>

  <!-- Scrollable Content -->
  <div class="flex-1 overflow-y-auto px-4 py-4">
    <!-- Challenges Grid -->
    <div id="challenges-grid" class="grid grid-cols-1 gap-3">
      <!-- Challenge cards will be inserted here -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12">
      <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="mt-2 text-sm font-medium text-slate-900">No challenges found</h3>
      <p class="mt-1 text-xs text-slate-500">Get started by creating a new challenge.</p>
    </div>
  </div>
</section>
