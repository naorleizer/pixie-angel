<section id="screen-dashboard" class="hidden flex-1 flex flex-col px-4 pb-4 pt-4 bg-slate-50">
  <!-- Header -->
  <header class="relative flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <!-- Hamburger menu icon -->
      <button class="w-10 h-10 rounded-xl bg-white shadow flex items-center justify-center cursor-pointer" onclick="toggleSidebar()" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <!-- Profile icon -->
      <button class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center cursor-pointer" onclick="navigate('profile')" aria-label="Profile">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zM6 20v-1a4 4 0 014-4h4a4 4 0 014 4v1" />
        </svg>
      </button>
      <!-- Greeting -->
      <div class="leading-tight">
        <h1 class="text-base font-semibold" id="dashboard-username">Hi User</h1>
      </div>
    </div>
    <button id="help-btn" class="text-slate-500 hover:text-indigo-600" aria-label="Open help" onclick="openHelp()">
      <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">?</span>
    </button>
  </header>

  <!-- Scrollable content -->
  <div class="flex-1 overflow-y-auto space-y-3 pb-4">


    <!-- Challenges carousel (bigger  dots  sliding) -->
    <div class="rounded-3xl fa-card shadow-sm border border-slate-200 px-5 py-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-semibold text-slate-800">Your challenges</p>
        <button class="text-xs text-indigo-600 font-semibold" onclick="navigate('challenges')">View All</button>
      </div>

      <div class="overflow-hidden">
        <div id="challenge-track" class="flex transition-transform duration-300 ease-out">
          <!-- Challenges will be injected here -->
        </div>
      </div>

      <!-- Carousel dots -->
      <div class="mt-4 flex items-center justify-center gap-2" id="challenge-dots">
        <!-- Dots injected here -->
      </div>
    </div>

    <!-- Balance widget (aggregated across ALL challenges) -->
    <div class="rounded-3xl fa-card shadow-sm border border-slate-200 px-5 py-4">
      <p class="text-sm font-semibold text-slate-800">Challenge balance</p>
      <p class="text-xs text-slate-500 mt-1">
        Overall saved vs. overspent impact across your active challenges.
      </p>

      <div class="mt-4 space-y-3">
        <div class="text-center">
          <span id="balance-amount" class="font-semibold text-emerald-700">Saved: 0₪</span>
        </div>

        <!-- Green/Gray balance bar placeholder -->
        <div class="w-full h-3 rounded-full bg-slate-100 overflow-hidden border border-slate-200">
          <div class="flex h-full">
            <div id="balance-bar-saved" class="h-3 bg-emerald-500" style="width: 0%"></div>
            <div id="balance-bar-overspent" class="h-3 bg-rose-500" style="width: 0%"></div>
          </div>
        </div>

        <div id="balance-summary" class="text-[11px] text-slate-500">
          Pixie summary: You're <span class="font-semibold text-emerald-700">on track</span>.
          Ready to start a challenge?
        </div>
      </div>
    </div>

    <!-- Transactions section (empty state with CTA) -->
    <div id="transactions-section" class="rounded-3xl fa-card shadow-sm border border-slate-200 px-5 py-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-semibold text-slate-800">Recent Transactions</p>
        <button class="text-xs text-indigo-600 font-semibold" onclick="navigate('import-transactions')">Import</button>
      </div>
      
      <!-- Empty state (show when no transactions) -->
      <div id="transactions-empty" class="text-center py-8">
        <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <p class="mt-3 text-sm text-slate-600">No transactions yet</p>
        <p class="text-xs text-slate-500 mt-1">Import your transaction history to get started</p>
        <button
          onclick="navigate('import-transactions')"
          class="mt-4 px-4 py-2 text-xs font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700"
        >
          Import Transactions
        </button>
      </div>

      <!-- Transaction list (show when data exists - hidden initially) -->
      <div id="transactions-list" class="hidden space-y-0">
        <!-- Will be populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Chat CTA (single-line placeholder only) -->
  <button class="mt-2 flex items-center gap-2 rounded-full fa-btn fa-btn-primary px-4 py-3 text-sm"
    onclick="openChat('decision', true)">
    <span class="flex-1 text-left text-white">Ask Pixie anything...</span>
    <span class="text-lg text-white">➤</span>
  </button>
</section>
