<section id="screen-notifications" class="hidden flex-1 flex flex-col bg-slate-50">
  <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <button class="text-slate-700 font-semibold" onclick="goBack()">←</button>
      <span class="text-sm font-semibold">Notifications</span>
    </div>
    <span class="text-xs text-slate-400">Recent</span>
  </header>

  <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
    <div id="notification-overspend"
      class="rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm cursor-pointer flex items-start gap-3 hover:bg-slate-50"
      onclick="openOverspendNotification(event)">
      <div class="mt-1 w-2 h-2 rounded-full bg-rose-500" id="notification-dot"></div>
      <div class="flex-1">
        <p class="text-sm font-semibold" id="notification-title">Eating out challenge is over budget</p>
        <p class="text-xs text-slate-600 mt-1" id="notification-text">
          You went over this week's plan. No worries—we can adjust to keep you on track.
        </p>
      </div>
      <span class="text-[10px] text-slate-400">Now</span>
    </div>

    <!-- Past notifications placeholder -->
    <div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
      <p class="text-sm font-semibold text-slate-700">Goal reminder</p>
      <p class="text-xs text-slate-500 mt-1">Keep up the great work—small steps add up.</p>
    </div>
  </div>
</section>
