# Pixie - Docker Compose Configuration
# Usage: docker compose up --build
# Access via http://<server-ip>:33380

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixie
      POSTGRES_PASSWORD: pixie_secret
      POSTGRES_DB: pixie
    volumes:
      - ./database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixie"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No external port - only accessible within Docker network

  # Flask Backend API
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Database connection (override to use Docker service name)
      DATABASE_URL: postgresql://pixie:pixie_secret@db:5432/pixie
      # Flask settings for production (override any .env values)
      FLASK_APP: app:create_app
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      # Vertex AI credentials (mount your service account JSON)
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service_account.json
      VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-gen-lang-client-0618054432}
      VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-us-central1}
    volumes:
      - ./backend/gen-lang-client-0618054432-7bcb63cb06ee.json:/app/credentials/service_account.json:ro
    # No external port - nginx proxies /api/ requests
    expose:
      - "35000"

  # Nginx Frontend (serves SPA + proxies API)
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ''
    depends_on:
      - backend
    ports:
      # Change this port to whatever you want to access the app on
      - "33380:80"
