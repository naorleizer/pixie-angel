<section id="screen-profile" class="hidden flex-1 flex flex-col px-4 pb-4 pt-4 bg-slate-50">
  <header class="relative flex items-center justify-center mb-4">
    <div class="absolute left-0 inset-y-0 flex items-center">
      <button onclick="goBack()" aria-label="Back" class="text-slate-700 font-semibold">←</button>
    </div>
    <h1 class="text-base font-semibold">Your account</h1>
  </header>

  <div class="flex-1 overflow-y-auto space-y-5 pb-4">
    <!-- Profile card -->
    <div class="rounded-2xl bg-slate-100 border border-slate-200 px-4 py-4 flex items-center gap-4">
      <div class="w-16 h-16 rounded-full bg-slate-300 flex items-center justify-center text-white font-semibold text-xl">R</div>
      <div>
        <div class="text-sm font-semibold">RutSavi</div>
        <div class="text-xs text-slate-500">@RutSavi</div>
      </div>
    </div>

    <!-- Settings -->
    <div>
      <p class="text-sm font-semibold text-slate-800 mb-2">Settings</p>
      <div class="space-y-2">
        <button onclick="goToScreen('screen-privacy')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Privacy and Data</button>
        <button onclick="goToScreen('screen-account-management')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Account management</button>
        <button onclick="logout()" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Log out</button>
      </div>
    </div>

    <!-- Support -->
    <div>
      <p class="text-sm font-semibold text-slate-800 mb-2">Support</p>
      <div class="space-y-2">
        <button onclick="goToScreen('screen-about')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">About</button>
        <button onclick="window.onboardingReturnScreen='screen-profile'; showOnboardingSlide(1); goToScreen('screen-onboarding')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Onboarding</button>
        <button onclick="goToScreen('screen-privacy-policy')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Privacy policy</button>
        <button onclick="goToScreen('screen-report-issue')" class="w-full text-left px-4 py-3 rounded-lg bg-white border border-slate-100 shadow-sm hover:bg-slate-50">Report an issue</button>
      </div>
    </div>
  </div>

  <!-- Bottom CTA (optional) -->
  
</section>
