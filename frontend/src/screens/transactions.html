<section id="screen-transactions" class="hidden flex-1 flex flex-col bg-slate-50">
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white sticky top-0 z-10">
      <div class="flex items-center gap-2">
        <button class="text-slate-700 font-semibold" onclick="goBack()" aria-label="Back">←</button>
        <span class="text-sm font-semibold">Transactions</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="add-transaction-btn" class="px-3 py-1 bg-indigo-600 text-white text-xs font-medium rounded-lg hover:bg-indigo-700 transition-colors">
          + Add
        </button>
        <select id="category-filter" class="text-xs border border-slate-300 rounded px-2 py-1 bg-white">
          <option value="">All Categories</option>
        </select>
        <button class="text-slate-500 hover:text-indigo-600" aria-label="Open help" onclick="openHelp()">
          <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">?</span>
        </button>
      </div>
    </header>
  
    <div class="flex-1 overflow-auto px-4 py-4">
      <div class="bg-white rounded-lg shadow-sm border border-slate-200">
        <table class="w-full text-sm" id="transactions-table">
          <tbody id="transactions-tbody">
            <!-- Transactions will be injected here -->
          </tbody>
        </table>
      </div>
      
      <!-- Pagination Controls -->
      <div id="transactions-pagination" class="flex items-center justify-between mt-4 px-2">
        <div class="text-xs text-slate-500">
          <span id="pagination-info">Showing 0 of 0</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="pagination-prev" class="px-3 py-1 text-xs font-medium text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            ← Prev
          </button>
          <span id="pagination-pages" class="text-xs text-slate-600">Page 1 of 1</span>
          <button id="pagination-next" class="px-3 py-1 text-xs font-medium text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Next →
          </button>
        </div>
      </div>
    </div>
    
    <!-- Transaction Modal (Add/Edit) -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-xl max-w-md w-full max-h-[90vh] overflow-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
          <h3 id="transaction-modal-title" class="text-lg font-semibold text-slate-900">Add Transaction</h3>
          <button id="transaction-modal-close" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>
        
        <form id="transaction-form" class="p-4 space-y-4">
          <input type="hidden" id="transaction-edit-id" value="">
          
          <!-- Amount Type Toggle -->
          <div class="flex items-center justify-center gap-2 p-1 bg-slate-100 rounded-lg">
            <button type="button" id="toggle-expense" class="flex-1 px-4 py-2 text-sm font-medium rounded-md transition-colors bg-red-500 text-white">
              Expense
            </button>
            <button type="button" id="toggle-income" class="flex-1 px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:bg-slate-200">
              Income
            </button>
          </div>
          
          <!-- Amount -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₪)</label>
            <input type="number" id="transaction-amount" step="0.01" min="0" required
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="0.00">
          </div>
          
          <!-- Date -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
            <input type="date" id="transaction-date" required
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          
          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
            <input type="text" id="transaction-description" required
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="e.g., Coffee at Aroma">
          </div>
          
          <!-- Merchant (optional) -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Merchant <span class="text-slate-400">(optional)</span></label>
            <input type="text" id="transaction-merchant"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="e.g., Aroma">
          </div>
          
          <!-- Category -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Category <span class="text-slate-400">(auto-detected if empty)</span></label>
            <select id="transaction-category"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
              <option value="">Auto-detect</option>
              <!-- Categories populated dynamically -->
            </select>
          </div>
          
          <!-- Transaction Type -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
            <select id="transaction-type"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
              <option value="card_purchase">Card Purchase</option>
              <option value="transfer">Transfer</option>
              <option value="bill_payment">Bill Payment</option>
              <option value="salary">Salary</option>
              <option value="cash">Cash</option>
              <option value="other">Other</option>
            </select>
          </div>
          
          <!-- Checkboxes -->
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" id="transaction-essential" checked
                     class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
              Essential
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" id="transaction-recurring"
                     class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
              Recurring
            </label>
          </div>
          
          <!-- Submit Button -->
          <div class="pt-2">
            <button type="submit" id="transaction-submit-btn"
                    class="w-full px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors">
              Add Transaction
            </button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div id="delete-confirm-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-xl max-w-sm w-full">
        <div class="p-6 text-center">
          <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-red-100 flex items-center justify-center">
            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </div>
          <h3 class="text-lg font-semibold text-slate-900 mb-2">Delete Transaction?</h3>
          <p class="text-sm text-slate-600 mb-6">This action cannot be undone. The transaction will be permanently removed.</p>
          <input type="hidden" id="delete-transaction-id" value="">
          <div class="flex gap-3">
            <button id="delete-cancel-btn" class="flex-1 px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">
              Cancel
            </button>
            <button id="delete-confirm-btn" class="flex-1 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
