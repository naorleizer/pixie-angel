<section id="screen-account-management" class="hidden flex-1 flex flex-col px-4 pb-4 pt-4 bg-slate-50">
  <header class="relative flex items-center justify-between mb-4">
    <div class="flex items-center">
      <button onclick="goBack()" aria-label="Back" class="text-slate-700 font-semibold">←</button>
    </div>
    <h1 class="text-base font-semibold">Account Management</h1>
    <button class="text-slate-500 hover:text-indigo-600" aria-label="Open help" onclick="openHelp()">
      <span class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">?</span>
    </button>
  </header>

  <div class="flex-1 overflow-y-auto space-y-5 pb-4">
    <!-- Interests Section -->
    <div>
      <p class="text-sm font-semibold text-slate-800 mb-3">Interests</p>
      <div id="acct-interests-container" class="flex flex-wrap gap-2 mb-3">
        <!-- Pills will be generated by JavaScript -->
      </div>
      <button onclick="saveInterests()" class="px-4 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700">Save Interests</button>
      <div id="acct-interests-message" class="mt-2 text-sm text-slate-500"></div>
    </div>

    <!-- Financial Persona Section -->
    <div>
      <p class="text-sm font-semibold text-slate-800 mb-2">Financial Persona</p>
      <select id="acct-persona-select" class="w-full px-3 py-2 border border-slate-300 rounded text-sm text-slate-700 bg-white hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="the_analyst">The Analyst - Objective and detailed</option>
        <option value="the_driver">The Driver - Assertive and results-focused</option>
        <option value="the_promoter">The Promoter - Energetic and inspiring</option>
        <option value="the_supportive">The Supportive - Warm and empathetic</option>
      </select>
      <button onclick="savePersonaPreference()" class="mt-2 px-4 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700">Save Preference</button>
      <div id="acct-persona-message" class="mt-2 text-sm text-slate-500"></div>
    </div>

    <!-- Motivations Section -->
    <div>
      <p class="text-sm font-semibold text-slate-800 mb-3">Motivations</p>
      <div id="acct-motivations-container" class="flex flex-wrap gap-2 mb-3">
        <!-- Pills will be generated by JavaScript -->
      </div>
      <button onclick="saveMotivations()" class="px-4 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700">Save Motivations</button>
      <div id="acct-motivations-message" class="mt-2 text-sm text-slate-500"></div>
    </div>
  </div>

  
</section>
